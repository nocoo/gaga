name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  locked-wrangler:
    name: Read locked Wrangler
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wrangler-version: ${{ steps.lockfile.outputs.wrangler-version }}
    steps:
      - name: Checkout lockfiles
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Read Wrangler version from lockfiles
        id: lockfile
        run: |
          python3 - <<'PY'
          import os
          import json
          import pathlib
          import re
          import sys

          bun_text = pathlib.Path("bun.lock").read_text(encoding="utf-8")
          bun_match = re.search(r'"wrangler":\s*\[\s*"wrangler@([^"]+)"', bun_text)
          if not bun_match:
              print("::error::wrangler is not locked in bun.lock", file=sys.stderr)
              sys.exit(1)
          bun_version = bun_match.group(1)

          lock = json.loads(pathlib.Path("package-lock.json").read_text(encoding="utf-8"))
          npm_entry = lock.get("packages", {}).get("node_modules/wrangler") or {}
          npm_version = npm_entry.get("version", "")
          if not npm_version:
              print("::error::wrangler is not locked in package-lock.json", file=sys.stderr)
              sys.exit(1)

          if bun_version != npm_version:
              print(
                  f"::error::lockfile wrangler mismatch: bun.lock={bun_version} package-lock.json={npm_version}",
                  file=sys.stderr,
              )
              sys.exit(1)

          exact = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(?:[.-][A-Za-z0-9.-]+)?$")
          if not exact.match(bun_version):
              print(f"::error::locked wrangler version is not exact: {bun_version}", file=sys.stderr)
              sys.exit(1)

          print(f"Locked wrangler {bun_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"wrangler-version={bun_version}\n")
          PY

  deploy:
    name: Deploy Worker
    needs: locked-wrangler
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      expected-workflow-path: ".github/workflows/ci.yml"
      expected-workflow-name: "CI"
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'push' && github.ref_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      runtime-version: "1.4.0"
      install-policy: "project"
      build-command: bun run build
      wrangler-version: ${{ needs.locked-wrangler.outputs.wrangler-version }}
      environment: production
      concurrency-group: deploy-gaga-production
      timeout-minutes: 15
      verify-command: |
        HTTP=$(curl -fsS -o /dev/null -w "%{http_code}" https://gaga.hexly.ai/ || echo "000")
        test "$HTTP" = "200"
      verify-retries: 6
      verify-retry-seconds: 5
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
