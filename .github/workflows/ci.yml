# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S3, G1, G2, B1, Z1 via quality.yml;
# na S2, L1.5, L2, L3, P1; todo L1 in slot-status. nocoo/base-ci v2026.12.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: project
      lockfiles: "bun.lock,package-lock.json"
      typecheck-command: "bun run typecheck"
      lint: false
      unit: false
      disabled-check-reasons: |-
        {
          "lint": "package.json 无 lint 脚本",
          "unit": "无 Vitest/单测套件"
        }
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      env-json: '{"CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "na", "reason": "package.json 无 lint 脚本或规则集"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "todo", "reason": "尚无单元测试与覆盖率门禁"},
        "L1.5": {"status": "na", "reason": "Worker 仅托管静态资源，无 vitest-pool-workers / miniflare 运行时套件"},
        "L2": {"status": "na", "reason": "无在 CI 中对外 HTTP 打点的 API E2E；/api/live 仅由发布 verify-command 抽检"},
        "L3": {"status": "na", "reason": "仓库不再积极维护；已移除 Playwright 浏览器 E2E"},
        "P1": {"status": "na", "reason": "package.json 为 private，不发布 npm 包"},
        "Z1": {"status": "impl"}}
