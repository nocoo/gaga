name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "project"
      prepare-command: "bun run build"
      typecheck-command: "bun run typecheck"
      lockfiles: "bun.lock,package-lock.json"
      lint: false
      unit: false
      disabled-check-reasons: |-
        {
          "lint": "project has no lint script; previous CI used a no-op lint-command",
          "unit": "previous CI used a no-op test-command; no unit suite is wired"
        }
